name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (e.g. v0.0.3)
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm & PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify VERSION file consistency
        run: |
          test "$(cat VERSION)" = "v$(node -e "console.log(require('./version.json').version)")"

      - name: Build JS package
        working-directory: js
        run: |
          npm ci
          npm run build

      - name: Publish JS package to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public || echo "Already published on npm."

      - name: Build Python package
        working-directory: py
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Publish Python package to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        working-directory: py
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --skip-existing || echo "Already uploaded to PyPI."
