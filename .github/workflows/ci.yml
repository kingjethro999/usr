name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-style:
    name: Code Style (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Verify Prettier formatting
        run: npm run format:check

  lint-and-typecheck:
    name: Lint & Typecheck (JS, Python, Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Lint and typecheck JS
        working-directory: js
        run: |
          npm run lint
          npm run typecheck

      - name: Install Web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint Web application
        working-directory: web
        run: pnpm lint

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx mypy

      - name: Typecheck Python with mypy
        working-directory: py
        run: mypy unixsr usr

  test:
    name: Test & Parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify VERSION file consistency
        run: |
          test "$(cat VERSION)" = "v$(node -e "console.log(require('./version.json').version)")"

      - name: Run version rollover logic tests
        run: node --test test/version.test.js

      - name: Run JS unit & cross-language parity tests
        working-directory: js
        run: |
          npm ci
          npm test

      - name: Run Python unit & cross-language parity tests
        working-directory: py
        run: |
          python -m pip install --upgrade pip
          pip install httpx
          python -m unittest -v test_usr.py test_parity.py

  build:
    name: Build Artifacts (JS, Python, Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build JS package (ESM & CJS)
        working-directory: js
        run: |
          npm ci
          npm run build

      - name: Build Python distribution (sdist & wheel)
        working-directory: py
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Build Web application
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit JS dependencies
        working-directory: js
        run: npm audit --audit-level=high
